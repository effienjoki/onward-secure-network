AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics order system (Week 2 lab). A two-AZ network with public and
  private subnets, an internet gateway, NAT gateways per AZ for updates, and a
  free S3 gateway endpoint. Company tags (Project, Owner, Environment) are applied
  as stack tags from deployment.yaml.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: dev
    Description: Used in resource names (company naming standard onward-<environment>-<purpose>)
  Owner:
    Type: String
    Default: Effie Njoki
    Description: Person responsible for the resources (company tagging standard)
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 image, looked up from AWS's public Parameter Store
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Free Tier eligible instance size

Resources:

  # ===========================================================================
  # CHAPTER 2: THE LAND (VPC, subnets, gates and signposts)
  # ===========================================================================

  # The estate: Onward's private network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-vpc'

  # The main gate to the internet, fixed to the estate's fence
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-igw'

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # The streets: one public and one private street in each of two AZs
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-public-a'

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-public-b'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-private-b'

  # Public signpost: "anywhere else -> the main gate". This makes subnets public.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Front desks (NAT gateways): private servers can go OUT for updates,
  # nobody can come IN. One per AZ, each in a PUBLIC subnet, each with a public IP.
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-nat-eip-a'

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-nat-a'

  NatEipB:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-nat-eip-b'

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-nat-b'

  # Private signposts: "anywhere else -> the front desk in MY OWN AZ"
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-private-rt-a'

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-private-rt-b'

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # Free private road to S3: Amazon Linux updates come from S3,
  # so this keeps update traffic off the NAT gateways (no NAT data charges)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB

  # ===========================================================================
  # CHAPTER 4: THE GUARDS (security groups, two-tier pattern, no port 22)
  # Each layer only accepts traffic from the layer in front of it.
  # ===========================================================================

  # Guard at the front door: customers and merchants on the web
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'onward-${Environment}-alb-sg'
      GroupDescription: Load balancer - HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Customers and merchants
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-alb-sg'

  # Guard at the front-end servers: only the load balancer may knock
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'onward-${Environment}-frontend-sg'
      GroupDescription: Front-end servers - HTTP only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Web traffic from the load balancer only
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-frontend-sg'

  # Guard at the internal order servers: only the front end may knock
  InternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'onward-${Environment}-internal-sg'
      GroupDescription: Internal order services - app port only from the front end
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Order service calls from the front end only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-internal-sg'

  # ===========================================================================
  # CHAPTER 5: THE BADGE (a role for servers, so Session Manager works)
  # No inline policies: the permission is an AWS managed policy, attached by ARN.
  # ===========================================================================

  # The badge: only EC2 servers may wear it
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'onward-${Environment}-server-role'
      Description: Lets servers register with Systems Manager (Session Manager)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'

  # The lanyard: how a server wears the badge
  ServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'onward-${Environment}-server-profile'
      Roles:
        - !Ref ServerRole

  # ===========================================================================
  # CHAPTER 6: THE FRONT DOOR (load balancer + self-healing front-end servers)
  # ===========================================================================

  # The receptionist: one public address, spread across both AZs
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'onward-${Environment}-alb'
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup

  # The receptionist's list of houses, with a health check
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'onward-${Environment}-frontend-tg'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  # The receptionist's rule: everything arriving on port 80 goes to the front end
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # The recipe for every front-end server
  FrontendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'onward-${Environment}-frontend-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ServerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref FrontendSecurityGroup
        MetadataOptions:
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub 'onward-${Environment}-frontend'
              - Key: Project
                Value: onward
              - Key: Owner
                Value: !Ref Owner
              - Key: Environment
                Value: !Ref Environment
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub 'onward-${Environment}-frontend-volume'
              - Key: Project
                Value: onward
              - Key: Owner
                Value: !Ref Owner
              - Key: Environment
                Value: !Ref Environment
        # Moving-in instructions: install a web server and the required page
        UserData:
          Fn::Base64: |
            #!/bin/bash
            dnf install -y httpd
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            cat > /var/www/html/index.html <<HTML
            <!DOCTYPE html>
            <html>
              <head><title>Onward Logistics Order System</title></head>
              <body style="font-family: Arial, sans-serif; text-align: center; margin-top: 80px;">
                <h1>Effie Njoki</h1>
                <h2>Lab: Designing secure Network for Onward Logistics Order System</h2>
                <p>Served by front-end server $INSTANCE_ID in Availability Zone $AZ</p>
              </body>
            </html>
            HTML
            systemctl enable --now httpd

  # The estate manager: keeps 2 front-end servers running, one per AZ, and replaces failures
  FrontendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub 'onward-${Environment}-frontend-asg'
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref FrontendLaunchTemplate
        Version: !GetAtt FrontendLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref FrontendTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

  # ===========================================================================
  # CHAPTER 7: THE BACK OFFICE (internal order servers, private, one per AZ)
  # No public IP, no key pair, no inbound from the internet.
  # Updates go out through the NAT gateways; engineers use Session Manager.
  # ===========================================================================

  # The recipe for internal servers
  InternalLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'onward-${Environment}-order-service-lt'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ServerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InternalSecurityGroup
        MetadataOptions:
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: onward
              - Key: Owner
                Value: !Ref Owner
              - Key: Environment
                Value: !Ref Environment
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: onward
              - Key: Owner
                Value: !Ref Owner
              - Key: Environment
                Value: !Ref Environment
        # A placeholder order service on port 8080, standing in for the real software
        UserData:
          Fn::Base64: |
            #!/bin/bash
            mkdir -p /opt/order-service
            echo "Onward internal order service on $(hostname). Internal only." > /opt/order-service/index.html
            cat > /etc/systemd/system/order-service.service <<UNIT
            [Unit]
            Description=Onward placeholder order service
            After=network.target
            [Service]
            WorkingDirectory=/opt/order-service
            ExecStart=/usr/bin/python3 -m http.server 8080
            Restart=always
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now order-service

  # One internal server in each AZ
  OrderServerA:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref InternalLaunchTemplate
        Version: !GetAtt InternalLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PrivateSubnetA
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-order-service-a'

  OrderServerB:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref InternalLaunchTemplate
        Version: !GetAtt InternalLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PrivateSubnetB
      Tags:
        - Key: Name
          Value: !Sub 'onward-${Environment}-order-service-b'

Outputs:
  WebsiteUrl:
    Description: Open this in a browser to see the front end
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  OrderServerAId:
    Description: Internal order server in the first AZ (reach it with Session Manager)
    Value: !Ref OrderServerA
  OrderServerBId:
    Description: Internal order server in the second AZ (reach it with Session Manager)
    Value: !Ref OrderServerB
  VpcId:
    Description: The order system's VPC
    Value: !Ref Vpc
  PublicSubnets:
    Description: Public subnets (load balancer only)
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  PrivateSubnets:
    Description: Private subnets (all servers)
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]